name: Deploy VulkanScope Database
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-tooling:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Verify canonical repository state
        run: python tools/repair_repository.py --check
      - name: Verify Windows/toolchain/release hardening
        run: python tools/verify_1_0_4_windows_toolchain_release.py
      - name: Exercise Windows path-sensitive Node regressions
        run: |
          node tools/test_compare_04141_compat.mjs
          node tools/test_compare_04141_negative_mutations.mjs
          node tools/test_surface_compare_04142.mjs
          node tools/test_surface_compare_04142_negative_mutations.mjs

  build:
    needs: windows-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Repair release checkout
        run: python tools/repair_repository.py --apply
      - name: Confirm 1.0.4 source files
        run: |
          python tools/repair_repository.py --check
          python tools/audit_database.py --version
      - name: Verify deterministic UTF-8 tooling
        run: python tools/test_utf8_text_io.py
      - name: Verify optional npm lock
        run: python tools/verify_optional_npm_lock.py
      - name: Test report-text API identity compatibility
        run: node tools/test_report_text_identity.mjs
      - name: Run spec / compatibility quality gate
        run: python tools/quality_gate.py
      - name: Build static index
        run: python tools/build_index.py
      - name: Audit tracked source checkout
        run: python tools/audit_database.py --source-tree .
      - name: Test source/artifact audit boundaries
        run: python tools/test_audit_hygiene.py
      - name: Check frontend JavaScript syntax
        run: |
          node --check assets/app.v1004.js
          node --check assets/encyclopedia.v03924.js
      - name: Test hash routes
        run: node tools/test_routes.mjs
      - name: Test compare semantics
        run: node tools/test_compare_contract.mjs
      - name: Test Surface Compare evidence semantics
        run: node tools/test_surface_compare_04142.mjs
      - name: Test Surface Compare negative mutations
        run: node tools/test_surface_compare_04142_negative_mutations.mjs
      - name: Verify VulkanScope 0.80.12 submission diagnostics
        run: |
          python tools/verify_03926_0812_submission_diagnostics.py
          python tools/test_03926_0812_submission_diagnostics_negative_mutations.py
      - name: Verify exact Vulkan registry baseline producer strings
        run: |
          python tools/verify_03927_registry_baseline_prefix.py
          python tools/test_03927_registry_baseline_prefix_negative_mutations.py
          python tools/verify_1_0_0_producer_baseline.py --skip-version
          python tools/verify_1_0_1_full_audit.py --skip-version
          node tools/test_surface_evidence_1001.mjs
          python tools/test_1_0_1_full_audit_negative_mutations.py
          python tools/verify_1_0_2_producer_baseline.py
          python tools/test_1_0_2_producer_baseline_state_machine.py
          python tools/test_1_0_2_producer_baseline_negative_mutations.py
      - name: Check Worker JavaScript syntax
        run: node --check worker/src/index.js
      - name: Test Worker contract
        run: node worker/tests/contract.mjs
      - name: Stage allow-listed Pages artifact
        run: python tools/build_pages_artifact.py _site
      - name: Build deploy-time preloaded report snapshot
        run: python tools/build_preload_snapshot.py _site/data/preload
      - name: Audit staged Pages artifact
        run: python tools/audit_database.py --artifact-tree _site
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5


  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Repair and verify tagged source
        run: |
          python tools/repair_repository.py --apply
          python tools/repair_repository.py --check
          python tools/verify_regression_contract.py --strict-tree
          python tools/verify_1_0_4_windows_toolchain_release.py
      - name: Build deterministic release assets
        run: python tools/package_release.py dist
      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/VulkanScope-Database-1.0.4.zip dist/VulkanScope-Database-1.0.4.zip.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/VulkanScope-Database-1.0.4.zip dist/VulkanScope-Database-1.0.4.zip.sha256 --verify-tag --title "VulkanScope Database 1.0.4" --generate-notes
          fi
