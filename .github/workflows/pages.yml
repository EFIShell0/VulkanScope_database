name: Release VulkanScope Database
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      mode:
        description: Release pipeline or asynchronous snapshot refresh
        required: true
        default: release
        type: choice
        options:
          - release
          - snapshot
      report_id:
        description: Fresh report ID required in snapshot mode
        required: false
        default: ""
        type: string
      submitted_at:
        description: Server-authored submission time for audit context
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: vulkanscope-database-${{ inputs.mode || 'release' }}
  cancel-in-progress: false

jobs:
  windows-tooling:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'snapshot' }}
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Repair release checkout before canonical verification
        run: |
          python tools/repair_repository.py --apply
          python tools/repair_repository.py --check
      - name: Verify Database 1.4.12 VulkanScope 3.0.12 floor/snapshot automation
        run: |
          python tools/verify_regression_contract.py
          python tools/verify_1_4_12_vulkanscope_3_0_12_snapshot.py
          python tools/test_1_4_12_vulkanscope_3_0_12_snapshot_negative_mutations.py
          python tools/audit_database.py --source-tree .
          node --check assets/app.v1412.js
          node --check worker/src/index.js
      - name: Install audited Worker toolchain on Windows
        working-directory: worker
        run: npm install
      - name: Exercise Windows security audit
        working-directory: worker
        run: npm run security:audit

  build:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'snapshot' }}
    needs: windows-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Repair release checkout
        run: python tools/repair_repository.py --apply
      - name: Run Database 1.4.12 quality gate
        run: python tools/quality_gate.py
      - name: Build static index
        run: python tools/build_index.py
      - name: Reverify generated index metadata
        run: |
          python tools/verify_1_4_12_vulkanscope_3_0_12_snapshot.py
          python tools/test_1_4_12_vulkanscope_3_0_12_snapshot_negative_mutations.py
      - name: Stage non-release-ready Pages artifact for audit
        run: python tools/build_pages_artifact.py _site
      - name: Audit non-release-ready Pages artifact
        run: python tools/audit_database.py --artifact-tree _site

  release:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'snapshot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Repair and verify release source
        run: |
          python tools/repair_repository.py --apply
          python tools/repair_repository.py --check
          python tools/verify_regression_contract.py
          python tools/verify_1_4_12_vulkanscope_3_0_12_snapshot.py
          python tools/test_1_4_12_vulkanscope_3_0_12_snapshot_negative_mutations.py
          python tools/audit_database.py --source-tree .
          node --check assets/app.v1412.js
      - name: Build deterministic release assets
        run: python tools/package_release.py dist
      - name: Create or refresh GitHub Release from validated main commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v1.4.12"
          ZIP="dist/VulkanScope-Database-1.4.12.zip"
          SHA="dist/VulkanScope-Database-1.4.12.zip.sha256"

          is_transient_github_error() {
            printf '%s' "$1" | grep -Eqi 'HTTP 429|HTTP 5[0-9][0-9]|rate limit|temporarily unavailable'
          }

          verify_remote_tag_owner() {
            git fetch --force origin "+refs/tags/$TAG:refs/tags/$TAG" >/dev/null 2>&1 || true
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
              TAG_SHA="$(git rev-list -n 1 "$TAG")"
              if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
                echo "Release $TAG already targets $TAG_SHA, not validated commit $GITHUB_SHA; bump the Database version instead of retargeting a published tag." >&2
                exit 1
              fi
              return 0
            fi
            return 1
          }

          for attempt in 1 2 3 4 5; do
            echo "GitHub Release publication attempt $attempt/5 for $TAG"

            set +e
            VIEW_OUT="$(gh release view "$TAG" --json tagName 2>&1)"
            VIEW_RC=$?
            set -e

            if [ "$VIEW_RC" -eq 0 ]; then
              verify_remote_tag_owner
              set +e
              OUT="$(gh release upload "$TAG" "$ZIP" "$SHA" --clobber 2>&1)"
              RC=$?
              set -e
              if [ "$RC" -eq 0 ]; then
                echo "Release $TAG assets are published."
                exit 0
              fi
            else
              if is_transient_github_error "$VIEW_OUT"; then
                OUT="$VIEW_OUT"
                RC="$VIEW_RC"
              else
                # A missing release is expected on first publication. A pre-existing tag is allowed only
                # when it resolves to the exact validated main commit.
                if verify_remote_tag_owner; then
                  CREATE_MODE=(--verify-tag)
                else
                  CREATE_MODE=(--target "$GITHUB_SHA")
                fi
                set +e
                OUT="$(gh release create "$TAG" "$ZIP" "$SHA" "${CREATE_MODE[@]}" --title "VulkanScope Database 1.4.12" --generate-notes 2>&1)"
                RC=$?
                set -e
                if [ "$RC" -eq 0 ]; then
                  echo "Release $TAG created."
                  exit 0
                fi
              fi
            fi

            printf '%s\n' "$OUT" >&2
            if ! is_transient_github_error "$OUT"; then
              echo "Non-transient GitHub Release failure; refusing to retry." >&2
              exit "$RC"
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "GitHub Release API remained unavailable after 5 attempts." >&2
              exit "$RC"
            fi
            sleep "$((attempt * 5))"
          done

  deploy:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'snapshot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: vulkanscope-database-pages-deployment
      cancel-in-progress: false
      queue: max
    needs: [build, release]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout released main commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Repair release checkout
        run: |
          python tools/repair_repository.py --apply
          python tools/repair_repository.py --check
      - name: Build deploy-time static index
        run: python tools/build_index.py
      - name: Stage deploy-time Pages artifact
        run: python tools/build_pages_artifact.py _site
      - name: Build deploy-time preloaded report snapshot
        run: python tools/build_preload_snapshot.py _site/data/preload
      - name: Mark staged artifact release-ready only after GitHub Release success
        run: python tools/mark_release_ready.py _site
      - name: Audit release-ready Pages artifact
        run: python tools/audit_database.py --artifact-tree _site --require-release-ready
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload release-ready GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy release-ready GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

  snapshot-refresh:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'snapshot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: vulkanscope-database-pages-deployment
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.snapshot_deployment.outputs.page_url }}
    steps:
      - name: Validate snapshot trigger
        shell: bash
        env:
          REPORT_ID: ${{ inputs.report_id }}
        run: |
          set -euo pipefail
          [[ "$REPORT_ID" =~ ^[a-f0-9]{64}$ ]] || { echo "snapshot mode requires a lowercase 64-hex report_id" >&2; exit 1; }
      - name: Checkout current main source
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Repair and verify snapshot source
        run: |
          python tools/repair_repository.py --apply
          python tools/repair_repository.py --check
          python tools/verify_1_4_12_vulkanscope_3_0_12_snapshot.py
          python tools/audit_database.py --source-tree .
      - name: Build current static index
        run: python tools/build_index.py
      - name: Stage current Pages artifact
        run: python tools/build_pages_artifact.py _site
      - name: Build authoritative preload snapshot including triggering report
        shell: bash
        env:
          REPORT_ID: ${{ inputs.report_id }}
        run: python tools/build_preload_snapshot.py _site/data/preload --expect-report-id "$REPORT_ID" --expect-attempts 8 --expect-delay 2
      - name: Mark snapshot artifact release-ready
        run: python tools/mark_release_ready.py _site
      - name: Audit snapshot artifact
        run: python tools/audit_database.py --artifact-tree _site --require-release-ready
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload snapshot Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          include-hidden-files: true
      - name: Deploy refreshed snapshot
        id: snapshot_deployment
        uses: actions/deploy-pages@v4
      - name: Verify published snapshot contains triggering report
        shell: bash
        env:
          PAGE_URL: ${{ steps.snapshot_deployment.outputs.page_url }}
          REPORT_ID: ${{ inputs.report_id }}
        run: python tools/verify_published_snapshot.py --base-url "$PAGE_URL" --report-id "$REPORT_ID" --attempts 12 --delay 3
