name: Deploy VulkanScope Database
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-tooling:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Verify canonical repository state
        run: python tools/repair_repository.py --check
      - name: Verify Database 1.0.14 release contract
        run: |
          python tools/verify_regression_contract.py
          python tools/verify_1_0_14_database_ui_integrity.py
          python tools/test_1_0_14_database_ui_integrity_negative_mutations.py
          node --check assets/app.v1014.js
          node --check worker/src/index.js
      - name: Install audited Worker toolchain on Windows
        working-directory: worker
        run: npm install
      - name: Exercise Windows security audit
        working-directory: worker
        run: npm run security:audit

  build:
    needs: windows-tooling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Repair release checkout
        run: python tools/repair_repository.py --apply
      - name: Run Database 1.0.14 quality gate
        run: python tools/quality_gate.py
      - name: Build static index
        run: python tools/build_index.py
      - name: Reverify generated index metadata
        run: |
          python tools/verify_1_0_14_database_ui_integrity.py
          python tools/test_1_0_14_database_ui_integrity_negative_mutations.py
      - name: Stage allow-listed Pages artifact
        run: python tools/build_pages_artifact.py _site
      - name: Build deploy-time preloaded report snapshot
        run: python tools/build_preload_snapshot.py _site/data/preload
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Repair and verify tagged source
        run: |
          python tools/repair_repository.py --apply
          python tools/repair_repository.py --check
          python tools/verify_regression_contract.py
          python tools/verify_1_0_14_database_ui_integrity.py
          python tools/test_1_0_14_database_ui_integrity_negative_mutations.py
      - name: Build deterministic release assets
        run: python tools/package_release.py dist
      - name: Create or refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/VulkanScope-Database-1.0.14.zip dist/VulkanScope-Database-1.0.14.zip.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/VulkanScope-Database-1.0.14.zip dist/VulkanScope-Database-1.0.14.zip.sha256 --verify-tag --title "VulkanScope Database 1.0.14" --generate-notes
          fi
